name: Poker server regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mini-services/poker-server/package-lock.json
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm ci --prefix mini-services/poker-server
      - run: npm run test:poker:profiles
      - run: npx tsc -p tsconfig.poker-ui-check.json --pretty false
      - run: npm run typecheck --prefix mini-services/poker-server
      - run: npm test --prefix mini-services/poker-server
      - run: npm run test:rpg:hybrid
      - run: npm run test:rpg:idle
      - run: node scripts/test-server-smoke.mjs
