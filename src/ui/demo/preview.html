<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holdem Coin · UI Preview (Leaderboard + Chips)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Cinzel:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    background: radial-gradient(ellipse at top, #2b1a0d 0%, #0a0604 100%);
    color: #fef3c7;
    min-height: 100vh;
  }
  .font-serif-gold { font-family: 'Cinzel', serif; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }

  .gold-text {
    background: linear-gradient(180deg, #ffe27a 0%, #d4a017 50%, #8b6914 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 2px 4px rgba(0,0,0,0.6);
  }

  .leaderboard-frame {
    border-image: url('../assets/leaderboard/Leaderboard_1_x4.png') 30 round;
    border-style: solid;
    border-width: 18px;
    border-radius: 12px;
    background: linear-gradient(180deg, #1a0e08 0%, #2b1a0d 50%, #1a0e08 100%);
    box-shadow:
      0 0 24px rgba(218,165,32,0.35),
      inset 0 0 16px rgba(0,0,0,0.6);
  }

  .row {
    background: linear-gradient(90deg, rgba(218,165,32,0.06) 0%, rgba(0,0,0,0) 80%);
  }
  .row.top1 { background: linear-gradient(90deg, rgba(218,165,32,0.18) 0%, rgba(0,0,0,0) 80%); }
  .row.top2 { background: linear-gradient(90deg, rgba(192,192,192,0.12) 0%, rgba(0,0,0,0) 80%); }
  .row.top3 { background: linear-gradient(90deg, rgba(205,127,50,0.15) 0%, rgba(0,0,0,0) 80%); }
  .row:hover { background-color: rgba(245, 158, 11, 0.1); }

  .rank-badge {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 50%;
    font-size: 13px; font-weight: 700; flex-shrink: 0;
  }
  .rank-badge.gold   { background: rgba(120, 53, 15, 0.6);  box-shadow: 0 0 0 2px #fde047; }
  .rank-badge.silver { background: rgba(120, 53, 15, 0.6);  box-shadow: 0 0 0 2px #d1d5db; }
  .rank-badge.bronze { background: rgba(120, 53, 15, 0.6);  box-shadow: 0 0 0 2px #b45309; }
  .rank-badge.normal { background: rgba(0,0,0,0.4); color: rgba(252, 211, 77, 0.7); }

  .avatar-placeholder {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, #b45309 0%, #451a03 100%);
    color: #fef3c7; font-size: 11px; font-weight: 700; flex-shrink: 0;
    box-shadow: 0 0 0 1px rgba(252, 211, 77, 0.3);
  }

  .amount {
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #ffe27a 0%, #d4a017 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .empty-slot {
    display: flex; height: 56px; align-items: center; justify-content: center;
    border-radius: 6px; border: 1px dashed rgba(252, 211, 77, 0.1);
    color: rgba(252, 211, 77, 0.2);
  }

  .chip-card {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(218, 165, 32, 0.2);
    border-radius: 8px; padding: 12px; text-align: center;
    transition: transform 0.2s, border-color 0.2s;
  }
  .chip-card:hover {
    transform: translateY(-2px);
    border-color: rgba(218, 165, 32, 0.6);
  }
  .chip-card img {
    width: 100%; aspect-ratio: 1; object-fit: contain;
    background: rgba(0, 0, 0, 0.6); border-radius: 4px;
  }
</style>
</head>
<body class="min-h-screen">
  <div class="container mx-auto px-4 py-8 max-w-5xl">

    <header class="mb-8 text-center">
      <h1 class="font-serif-gold text-4xl gold-text font-bold tracking-wider">HOLDEM COIN</h1>
      <p class="text-sm tracking-[0.4em] text-amber-300/60 mt-1">UI PREVIEW · UI 미리보기</p>
    </header>

    <div class="grid lg:grid-cols-2 gap-8 items-start">

      <section>
        <h2 class="font-serif-gold text-xl gold-text mb-3">1. Leaderboard · 리더보드</h2>

        <div class="leaderboard-frame mx-auto w-full max-w-md">
          <div class="px-4 pt-3 pb-2 text-center">
            <h3 class="font-serif-gold text-2xl gold-text font-bold tracking-wider">LEADERBOARD</h3>
            <p class="text-xs tracking-[0.3em] text-amber-200/70">리더보드</p>
          </div>

          <ol id="player-list" class="space-y-1 px-2 pb-2" style="min-height: 120px;"></ol>

          <div id="controls" class="flex justify-center pb-3 gap-2"></div>
        </div>

        <div class="mt-4 flex flex-wrap gap-2 justify-center">
          <button onclick="addPlayer()" class="px-3 py-1.5 rounded-md bg-amber-600/30 border border-amber-500/40 text-amber-100 text-xs hover:bg-amber-600/50">+ 플레이어 추가</button>
          <button onclick="removePlayer()" class="px-3 py-1.5 rounded-md bg-red-900/30 border border-red-700/40 text-red-200 text-xs hover:bg-red-900/50">- 플레이어 제거</button>
          <button onclick="shufflePlayers()" class="px-3 py-1.5 rounded-md bg-purple-900/30 border border-purple-700/40 text-purple-200 text-xs hover:bg-purple-900/50">↻ 셔플</button>
          <span id="count-info" class="px-3 py-1.5 text-xs text-amber-300/60 self-center"></span>
        </div>
      </section>

      <section>
        <h2 class="font-serif-gold text-xl gold-text mb-3">2. Chip Sprites · 칩 스프라이트</h2>
        <p class="text-xs text-amber-200/60 mb-4">10개 칩 (Chip_01 ~ Chip_10), AI 재생성된 1024×1024 PNG</p>

        <div id="chip-gallery" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>
      </section>
    </div>

    <footer class="mt-12 text-center text-xs text-amber-300/40">
      Generated by holdem_coin UI pipeline · 골드 카지노 톤 · 한영 병기
    </footer>
  </div>

<script>
  const NAMES = ['Alice', 'Bob', 'Charlie', 'Diana', 'Eve', 'Frank', 'Grace', 'Henry', 'Iris', 'Jack', 'Karen', 'Leo'];
  let players = [
    { id: 1, name: 'Alice',    amount: 9876543, trend: 'same' },
    { id: 2, name: 'Bob',      amount: 8123456, trend: 'up' },
    { id: 3, name: 'Charlie',  amount: 7234567, trend: 'down' },
    { id: 4, name: 'Diana',    amount: 6234567, trend: 'up' },
    { id: 5, name: 'Eve',      amount: 5234567, trend: 'same' },
    { id: 6, name: 'Frank',    amount: 4234567, trend: 'down' },
    { id: 7, name: 'Grace',    amount: 3234567, trend: 'up' },
  ];

  const CURRENCY = 'K';
  let maxVisible = 7;
  let visibleCount = 7;

  function formatAmount(amount, currency) {
    const s = amount.toLocaleString('en-US');
    return currency === 'K' ? s + ' K' : s + ' ' + currency;
  }

  function rankBadge(rank) {
    if (rank === 1) return `<div class="rank-badge gold" aria-label="Rank 1">👑</div>`;
    if (rank === 2) return `<div class="rank-badge silver" aria-label="Rank 2">🥈</div>`;
    if (rank === 3) return `<div class="rank-badge bronze" aria-label="Rank 3">🥉</div>`;
    return `<div class="rank-badge normal" aria-label="Rank ${rank}">${rank}</div>`;
  }

  function trendIcon(trend) {
    if (trend === 'up')   return `<span aria-label="trend up"   style="color:#4ade80">▲</span>`;
    if (trend === 'down') return `<span aria-label="trend down" style="color:#f87171">▼</span>`;
    if (trend === 'new')  return `<span aria-label="new entry"  style="color:#a78bfa">★</span>`;
    return '';
  }

  function render() {
    const sorted = [...players].sort((a, b) => b.amount - a.amount);
    const visible = sorted.slice(0, visibleCount);
    const hasMore = visibleCount < sorted.length;
    const isExpanded = visibleCount > maxVisible;
    const emptyCount = Math.max(0, Math.min(maxVisible, maxVisible - visible.length));

    const list = document.getElementById('player-list');
    let html = '';
    visible.forEach((p, idx) => {
      const rank = idx + 1;
      const cls = rank === 1 ? 'top1' : rank === 2 ? 'top2' : rank === 3 ? 'top3' : '';
      const avatar = p.name.slice(0, 2).toUpperCase();
      html += `
        <li class="row ${cls} group flex items-center gap-3 rounded-md px-3 py-2 transition-all duration-200 hover:bg-amber-500/10 cursor-pointer" style="min-height:56px">
          ${rankBadge(rank)}
          <div class="avatar-placeholder" aria-hidden>${avatar}</div>
          <div class="flex min-w-0 flex-1 flex-col">
            <span class="truncate font-serif-gold text-base text-amber-50" title="${p.name}">${p.name}</span>
            <span class="text-[10px] tracking-wider text-amber-300/60">Player · 플레이어</span>
          </div>
          ${trendIcon(p.trend || 'same')}
          <div class="flex flex-shrink-0 flex-col items-end">
            <span class="font-mono text-base font-bold amount">${formatAmount(p.amount, CURRENCY)}</span>
          </div>
        </li>`;
    });
    for (let i = 0; i < emptyCount; i++) {
      html += `<li class="empty-slot">—</li>`;
    }
    list.innerHTML = html;

    const ctrl = document.getElementById('controls');
    let chtml = '';
    if (hasMore) {
      chtml += `<button type="button" onclick="expand()" class="rounded-full border border-amber-400/50 bg-amber-900/30 px-4 py-1 text-xs text-amber-100 hover:bg-amber-700/40">▼ 더 보기 · Show more (${sorted.length - visibleCount})</button>`;
    }
    if (isExpanded) {
      chtml += `<button type="button" onclick="collapse()" class="rounded-full border border-amber-400/30 px-4 py-1 text-xs text-amber-200/70 hover:bg-amber-900/20">▲ 접기 · Collapse</button>`;
    }
    ctrl.innerHTML = chtml;

    document.getElementById('count-info').textContent = `${players.length} players · ${visibleCount} 표시`;
  }

  function expand()   { visibleCount = Math.min(visibleCount + 5, players.length); render(); }
  function collapse() { visibleCount = maxVisible; render(); }

  function addPlayer() {
    const idx = players.length + 1;
    const name = NAMES[(idx - 1) % NAMES.length] + '_' + idx;
    const amount = Math.floor(Math.random() * 9000000) + 500000;
    players.push({ id: idx, name, amount, trend: 'new' });
    render();
  }
  function removePlayer() {
    if (players.length > 3) {
      players.pop();
      if (visibleCount > players.length) visibleCount = players.length;
      render();
    }
  }
  function shufflePlayers() {
    players = players.map(p => ({ ...p, amount: Math.floor(Math.random() * 9000000) + 500000, trend: Math.random() > 0.5 ? 'up' : 'down' }));
    render();
  }

  function renderChips() {
    const gallery = document.getElementById('chip-gallery');
    let html = '';
    for (let i = 1; i <= 10; i++) {
      const num = String(i).padStart(2, '0');
      html += `
        <div class="chip-card">
          <img src="../assets/chips/Chip_${num}.png" alt="Chip ${num}" loading="lazy">
          <div class="mt-2 text-xs gold-text font-mono">Chip_${num}</div>
          <div class="text-[10px] text-amber-300/40">1024×1024 PNG</div>
        </div>`;
    }
    gallery.innerHTML = html;
  }

  render();
  renderChips();
</script>
</body>
</html>
