<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>바르디안 원거리·보스 이펙트 복원</title><style>body{background:#0d1821;color:#ecdbad;font:15px system-ui;max-width:1050px;margin:28px auto;padding:18px}p{color:#b2c5cc;line-height:1.8}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}article{border:1px solid #586c6c;background:#132830;border-radius:12px;padding:14px}img{width:100%;height:210px;object-fit:contain;background:radial-gradient(#283d47,#08151b)}small{color:#a6c8be;word-break:break-all}.warn{height:110px;display:grid;place-items:center}.warn i{display:block;width:150px;height:42px;border:3px solid #ffe169;border-radius:50%;background:#dfb63b30;box-shadow:0 0 14px #e1bc6240;animation:pulse 1.2s infinite}@keyframes pulse{50%{box-shadow:0 0 24px #eac15a99}}a{color:#81d7cb}</style><h1>원거리 · 장판 · 보스 마법</h1><p>원본에서 추출해 두었던 Unity 이펙트의 XY 미리보기입니다. Unity 커스텀 셰이더와 3D 원근은 완전히 재현되지 않았습니다. 런타임은 같은 프리뷰를 WebP 시트로 재생합니다. 아래 프리팹 선택은 종류별 시각 대응이며 GUID 연결 확정을 의미하지 않습니다.</p><p><a href="/hunt">전투로 돌아가기</a> · <a href="manifest.json">출처·파일 해시</a></p><main id="gallery"></main><script>fetch('manifest.json').then(r=>r.json()).then(d=>{const root=document.getElementById('gallery');for(const e of d.effects){const a=document.createElement('article'),h=document.createElement('h2'),img=document.createElement('img'),p=document.createElement('small');h.textContent=e.id;img.src='/rpg/vfx/previews/'+e.prefab+'.gif';img.alt=e.prefab;p.textContent=e.prefab;a.append(h,img,p);root.append(a)}const a=document.createElement('article');a.innerHTML='<h2>노란 장판 예고</h2><div class="warn"><i></i></div><p>원본 WarningMark의 평면 경고 역할을 코드로 재구성. 원본 경고 텍스처가 없어 원본 이미지 추출로 표시하지 않습니다.</p>';root.append(a)});</script></html>
