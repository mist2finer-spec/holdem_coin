<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vardian 몬스터 원본 모션 확인</title>
<style>body{margin:0;background:#101820;color:#eee;font:16px system-ui}main{max-width:960px;margin:auto;padding:20px}select,button{padding:10px;margin:4px;max-width:100%;background:#243442;color:white;border:1px solid #72878e;border-radius:6px}canvas{width:100%;height:auto;border:1px solid #72878e}p{line-height:1.6;color:#bbc9ce}</style>
<main><h1>몬스터 원본 모션</h1><label>몬스터 <select id="monster"></select></label><label>동작 <select id="clip"></select></label><button id="replay">한 번 재생</button>
<p id="status">불러오는 중…</p><canvas width="960" height="600"></canvas>
<p>원본 에셋 확인용입니다. 실제 미궁의 등장 순서·히트박스·피해 계산을 재현하는 전투 시뮬레이터는 아닙니다. 원본의 비정상 변환이 검출된 클립은 목록에서 제외합니다.</p>
<p>폴더에서 <code>python -m http.server 8766</code> 실행 후 <code>http://localhost:8766/gallery.html</code>을 여세요.</p></main>
<script type="module" src="gallery.js"></script></html>
