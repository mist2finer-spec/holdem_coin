<!doctype html><html lang="ko"><meta charset="utf-8"><title>홍 알파 마스크 검토</title><style>body{font:16px system-ui;background:#17202c;color:white}canvas{width:768px;max-width:90vw;image-rendering:pixelated;touch-action:none;background:conic-gradient(#9ba3aa 25%,#57616d 0 50%,#9ba3aa 0 75%,#57616d 0) 0 0/20px 20px}button,input{margin:8px}p{max-width:850px}</style><h2>전투 홍 · 투명도 검토</h2><p>원본 픽셀을 유지하고 알파만 편집합니다. 검은 옷·머리·윤곽이 지워졌으면 복원 브러시로 되살리세요. 자동 결과는 검수 전 초안입니다.</p><label><input type="radio" name="tool" value="erase" checked>배경 지우기</label><label><input type="radio" name="tool" value="restore">원본 복원</label><label>크기<input id="size" type="range" min="1" max="16" value="2"></label><button id="save">수정 알파 PNG 저장</button><button id="reset">초기 마스크로</button><p>저장된 hong_alpha.edited.png를 다음 Prepare의 -AlphaMask로 지정합니다. 새 작업 폴더를 사용해 기존 파츠를 보존하세요.</p><canvas id="view" width="256" height="256"></canvas><script>
const original=new Image(),initial=new Image(),cv=document.getElementById('view'),ctx=cv.getContext('2d'),mask=document.createElement('canvas'),m=mask.getContext('2d'),work=document.createElement('canvas'),w=work.getContext('2d');mask.width=mask.height=work.width=work.height=256;let ready=0,drag=false,last;
function draw(){w.clearRect(0,0,256,256);w.drawImage(original,0,0);let pixels=w.getImageData(0,0,256,256),alpha=m.getImageData(0,0,256,256);for(let i=0;i<pixels.data.length;i+=4)pixels.data[i+3]=alpha.data[i];w.putImageData(pixels,0,0);ctx.clearRect(0,0,256,256);ctx.drawImage(work,0,0)}
function init(){if(++ready===2){m.drawImage(initial,0,0);draw()}}original.onload=init;initial.onload=init;original.src='__ORIGINAL__';initial.src='__MASK__';
function point(e){let r=cv.getBoundingClientRect();return [(e.clientX-r.left)*256/r.width,(e.clientY-r.top)*256/r.height]}
function paint(e){if(ready<2)return;let p=point(e),color=document.querySelector('input[name=tool]:checked').value==='erase'?'black':'white';m.strokeStyle=m.fillStyle=color;m.lineWidth=Number(document.getElementById('size').value);m.lineCap='round';m.beginPath();m.moveTo(...(last||p));m.lineTo(...p);m.stroke();m.beginPath();m.arc(...p,m.lineWidth/2,0,7);m.fill();last=p;draw()}
cv.onpointerdown=e=>{drag=true;last=null;cv.setPointerCapture(e.pointerId);paint(e)};cv.onpointermove=e=>{if(drag)paint(e)};cv.onpointerup=()=>{drag=false;last=null};cv.onpointercancel=cv.onpointerup;document.getElementById('reset').onclick=()=>{m.drawImage(initial,0,0);draw()};document.getElementById('save').onclick=()=>{let a=document.createElement('a');a.download='hong_alpha.edited.png';a.href=mask.toDataURL('image/png');a.click()};
</script></html>
